[project]
name = "django-content-parsing"
version = "0.1.0"
description = "A proof-of-concept implementation of Django content type parsing to include JSON."
readme = "README.md"
authors = [
    { name = "Chris Muthig", email = "camuthig@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "django>=5.2,<6.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
