[project]
name = "django-content-parsing"
version = "0.1.0"
description = "A proof-of-concept implementation of Django content type parsing to include JSON."
readme = "README.md"
authors = [
    { name = "Chris Muthig", email = "camuthig@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "django>=5.2,<6.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]


[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "example"]

[tool.ruff.lint]
extend-select = [
    "I",  # isort
    "TID252",  # prefer using absolute over relative imports
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
